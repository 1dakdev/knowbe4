services:
  - type: web
    name: knowbe4
    runtime: python
    runtimeVersion: "3.10"
    buildCommand: "cd backend && pip install -r requirements.txt && python init_demo_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./data/k12_assessment.db"
      - key: TEST_DATABASE_URL
        value: "sqlite:///./data/test.db"
      - key: SECRET_KEY
        value: "knowbe4-secret-key-for-hackathon-2026"
      - key: GEMINI_API_KEY
        sync: false
    staticPublicPath: backend/static
    healthCheckPath: /docs
